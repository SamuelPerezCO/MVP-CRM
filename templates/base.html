{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · MVP CRM</title>
  <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'css/inbox.css' %}">
  <link rel="stylesheet" href="{% static 'css/crm.css' %}">
  <link rel="stylesheet" href="{% static 'css/embudos.css' %}">
  <link rel="stylesheet" href="{% static 'css/welcome.css' %}">
  {# Vendored so the app has no CDN dependency at runtime. #}
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body>
  <div class="app">
    {% include "partials/sidebar.html" %}

    <main class="content" id="content" hx-history-elt>
      {% include section_template %}
    </main>
  </div>

  <script src="{% static 'js/shell.js' %}" defer></script>
</body>
</html>
