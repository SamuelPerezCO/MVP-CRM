# GitGuardian configuration.
#
# The scanner flags the passwords in this project's auth tests -- "clave-larga",
# "admin-pw", "secreto123" and friends. They are fixtures: an authentication
# test cannot be written without a password to authenticate with, and every one
# of them is invented in the test that uses it. None is, or ever was, a real
# credential: none appears outside a test file.
#
# Only test paths are ignored, and only for secret detection. A credential
# hardcoded in shipped code -- settings, a provider, a management command --
# still fails, which is the part worth keeping. Widening this to the whole
# repository would have hidden the two real ones this project has already had
# to remove: webhook secrets that shipped with a default value committed here,
# which is the same as having no secret at all.
#
# SCOPE, measured rather than assumed: this file is read by ggshield -- the
# CLI and the pre-commit hook. The GitGuardian GitHub App does NOT read it;
# adding this file left its check reporting the same 16 findings on the very
# commit that introduced it. The App's ignores live in the GitGuardian
# dashboard, so silencing those 16 on pull requests means triaging them there
# as false positives. Kept anyway: it is what makes a local `ggshield scan`
# usable, and it records which paths were judged fixtures and why.
version: 2

secret:
  ignored-paths:
    - "core/tests*.py"
    - "core/tests/**"
    - "messaging/tests*.py"
    - "messaging/tests/**"
